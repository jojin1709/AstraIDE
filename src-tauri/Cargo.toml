[package]
name = "astraide"
version = "0.1.0"
description = "AstraIDE - Lightweight Android Development Environment for Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.32"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
walkdir = "2"
regex = "1"
chrono = "0.4"
rfd = "0.15"
