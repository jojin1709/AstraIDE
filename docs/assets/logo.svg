<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="astra-cyan-streak" x1="120" y1="380" x2="480" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="45%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="astra-right-leg" x1="280" y1="280" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="astra-fold" x1="120" y1="410" x2="160" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052cc"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="astra-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Dark Geometric Left Leg & Apex -->
  <path d="M 238 98 L 78 392 L 126 418 L 244 202 L 302 242 L 318 214 Z" fill="#1e293b" />
  
  <!-- Lower Fold on Left Leg -->
  <path d="M 126 418 L 78 392 L 168 368 Z" fill="url(#astra-fold)" />

  <!-- Secondary Right Leg Element -->
  <path d="M 282 308 L 344 424 L 434 424 L 362 268 Z" fill="url(#astra-right-leg)" />

  <!-- Diagonal Electric Blue / Cyan Orbital Streak -->
  <polygon points="120,402 468,188 382,234 168,368" fill="url(#astra-cyan-streak)" />
</svg>
